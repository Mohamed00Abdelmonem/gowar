services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gowar_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gowar_db}
      POSTGRES_USER: ${POSTGRES_USER:-gowar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gowar_dev_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gowar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gowar_user} -d ${POSTGRES_DB:-gowar_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gowar_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - gowar_media:/app/media
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

volumes:
  gowar_pgdata:
  gowar_media:
