# Internal Nginx server inside gowar-frontend container.
# Terminates HTTP on container port 80 behind the host Nginx HTTPS reverse proxy.

upstream gowar_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20M;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Lightweight container health endpoint
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Django backend health check
    location = /health/ {
        proxy_pass http://gowar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # Django REST API (never cache authenticated API responses)
    location /api/ {
        proxy_pass http://gowar_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Django Admin
    location /django-admin/ {
        proxy_pass http://gowar_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Collected Django static files (shared volume from backend)
    location /static/ {
        alias /srv/gowar/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Persistent uploaded media files (store logos, covers, product images)
    location /media/ {
        alias /srv/gowar/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Vite hashed assets (safe to cache aggressively)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React SPA root & nested route fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
