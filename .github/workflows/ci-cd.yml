name: Gowar CI/CD (Test, Build & Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend Tests (Django + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gowar_test_db
          POSTGRES_USER: gowar_test_user
          POSTGRES_PASSWORD: gowar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gowar_test_user -d gowar_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install GeoDjango system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install backend dependencies
        run: pip install -r backend/requirements/dev.txt

      - name: Run Ruff linter
        working-directory: backend
        run: ruff check .

      - name: Run Pytest suite
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          POSTGRES_DB: gowar_test_db
          POSTGRES_USER: gowar_test_user
          POSTGRES_PASSWORD: gowar_test_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: pytest

  frontend-test:
    name: Frontend Tests, Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_USE_BACKEND_API: "true"
        run: npm run build

  build-and-push:
    name: Build & Push Production Docker Images (GHCR)
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase GHCR image prefix and SHA tag
        id: meta
        run: |
          REPO_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          echo "image_prefix=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-backend:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image_prefix }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_USE_BACKEND_API=true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-frontend:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image_prefix }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Contabo VPS
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,IMAGE_PREFIX,GHCR_USERNAME,GHCR_READ_TOKEN
          script: |
            set -euo pipefail
            cd /opt/gowar
            if [ -n "${GHCR_READ_TOKEN:-}" ]; then
              echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            fi
            bash /opt/gowar/scripts/deploy.sh "${IMAGE_TAG}" "${IMAGE_PREFIX}"
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
